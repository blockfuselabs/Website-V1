name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js (standalone)
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          BLOCKFUSE_API_BASE_URL: ${{ secrets.BLOCKFUSE_API_BASE_URL }}
          GITHUB_REPOS_URL: ${{ secrets.GH_REPOS_URL }}

      - name: Prepare deployment bundle
        working-directory: frontend
        run: |
          cp -r public/ .next/standalone/
          cp -r .next/static/ .next/standalone/.next/static/
          # Lockfile pins the exact versions CI built with; dev-only
          # packages aren't needed to run the server.
          cp package-lock.json .next/standalone/
          node -e "const f='./.next/standalone/package.json';const p=require(f);delete p.devDependencies;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: blockfuse-website-v1/
          local-dir: frontend/.next/standalone/
          # node_modules is left out (the action's default exclude): on this
          # CloudLinux host it is a symlink into ~/nodevenv managed by cPanel,
          # so dependencies are installed there with "Run NPM Install".
